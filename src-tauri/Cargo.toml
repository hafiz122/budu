[package]
name = "budu"
version = "0.1.1"
description = "Run Windows Steam games on Apple Silicon Macs"
authors = []
edition = "2021"
rust-version = "1.77"
license = "GPL-3.0-only"

[lib]
name = "budu_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
regex = "1"
glob = "0.3"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
shell-words = "1"
walkdir = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
